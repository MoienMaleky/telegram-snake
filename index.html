<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>بازی مار تلگرام | Snake Mini App</title>
  <!-- Telegram Web App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    body {
      background: radial-gradient(circle at center, #1a2234 0%, #0d111a 100%);
      color: #ffffff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      overflow: hidden;
      padding: 12px;
      touch-action: manipulation;
    }

    header {
      width: 100%;
      max-width: 420px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .stat-badge {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      padding: 6px 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 80px;
    }

    .stat-label {
      font-size: 11px;
      color: #94a3b8;
      font-weight: 500;
    }

    .stat-value {
      font-size: 18px;
      font-weight: 700;
      color: #38ef7d;
    }

    .stat-value.high {
      color: #f59e0b;
    }

    .header-title {
      font-size: 16px;
      font-weight: bold;
      background: linear-gradient(135deg, #10b981, #38ef7d);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    #game-container {
      position: relative;
      width: 100%;
      max-width: 380px;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.6);
      border-radius: 18px;
      overflow: hidden;
      border: 2px solid rgba(56, 239, 125, 0.25);
    }

    canvas {
      display: block;
      background: #0b0f19;
      border-radius: 16px;
      width: 100%;
      aspect-ratio: 1 / 1;
    }

    /* Game Over & Pause Overlays */
    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(11, 15, 25, 0.88);
      backdrop-filter: blur(6px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      z-index: 10;
      text-align: center;
      padding: 20px;
    }

    .overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .overlay h2 {
      font-size: 26px;
      margin-bottom: 8px;
      font-weight: 800;
    }

    .overlay.game-over h2 {
      color: #ef4444;
      text-shadow: 0 0 16px rgba(239, 68, 68, 0.4);
    }

    .overlay p {
      font-size: 14px;
      color: #94a3b8;
      margin-bottom: 16px;
    }

    .btn {
      background: linear-gradient(135deg, #10b981, #059669);
      color: #ffffff;
      border: none;
      padding: 10px 24px;
      font-size: 15px;
      font-weight: bold;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.35);
      transition: transform 0.1s, box-shadow 0.1s;
      outline: none;
    }

    .btn:active {
      transform: scale(0.95);
      box-shadow: 0 2px 6px rgba(16, 185, 129, 0.2);
    }

    /* D-Pad Controls for Touch / Mobile */
    .controls-wrapper {
      width: 100%;
      max-width: 320px;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 10px;
      direction: ltr; /* جلوگیری از جابجایی دکمه‌های چپ و راست در حالت راست‌به‌چپ */
    }

    .dpad-row {
      display: flex;
      flex-direction: row;
      gap: 12px;
      justify-content: center;
      width: 100%;
      margin: 4px 0;
      direction: ltr;
    }

    .dpad-btn {
      width: 60px;
      height: 52px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 14px;
      color: #e2e8f0;
      font-size: 22px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
      transition: background 0.1s, transform 0.1s;
      -webkit-tap-highlight-color: transparent;
    }

    .dpad-btn:active {
      background: rgba(56, 239, 125, 0.3);
      border-color: #38ef7d;
      transform: scale(0.92);
    }

    .footer-hints {
      font-size: 11px;
      color: #64748b;
      text-align: center;
      margin-top: 6px;
      direction: rtl;
    }
  </style>
</head>
<body>

  <header>
    <div class="stat-badge">
      <span class="stat-label">امتیاز</span>
      <span id="score-val" class="stat-value">0</span>
    </div>

    <div class="header-title">
      <span>🐍</span>
      <span>بازی مار تلگرام</span>
    </div>

    <div class="stat-badge">
      <span class="stat-label">رکورد</span>
      <span id="high-score-val" class="stat-value high">0</span>
    </div>
  </header>

  <div id="game-container">
    <canvas id="gameCanvas" width="400" height="400"></canvas>

    <!-- Game Over Screen -->
    <div id="gameOverOverlay" class="overlay game-over">
      <h2>باختی! 💀</h2>
      <p id="finalScoreText">امتیاز شما: 0</p>
      <button class="btn" onclick="restartGame()">دوباره بازی کن 🔄</button>
    </div>

    <!-- Start / Ready Screen -->
    <div id="startOverlay" class="overlay active">
      <h2 style="color: #38ef7d;">آماده‌ای؟ 🎮</h2>
      <p>مار رو با دکمه‌ها یا کشیدن انگشت کنترل کن!</p>
      <button class="btn" onclick="startGame()">شروع بازی ▶️</button>
    </div>
  </div>

  <!-- Touch D-Pad for Mobile -->
  <div class="controls-wrapper">
    <div class="dpad-row">
      <button class="dpad-btn" id="btn-up" onclick="handleDirection('UP')">⬆️</button>
    </div>
    <div class="dpad-row">
      <button class="dpad-btn" id="btn-left" onclick="handleDirection('LEFT')">⬅️</button>
      <button class="dpad-btn" id="btn-pause" onclick="togglePause()" style="font-size: 18px;">⏸️</button>
      <button class="dpad-btn" id="btn-right" onclick="handleDirection('RIGHT')">➡️</button>
    </div>
    <div class="dpad-row">
      <button class="dpad-btn" id="btn-down" onclick="handleDirection('DOWN')">⬇️</button>
    </div>
    <div class="footer-hints">می‌توانید از کلیدهای جهت‌نما یا لمس کشیدنی هم استفاده کنید</div>
  </div>

  <script>
    // --- Telegram Web App Setup ---
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
      try {
        tg.headerColor = '#0d111a';
        tg.backgroundColor = '#0d111a';
      } catch (e) {}
    }

    function triggerHaptic(type = 'impact') {
      if (tg && tg.HapticFeedback) {
        if (type === 'impact') tg.HapticFeedback.impactOccurred('medium');
        else if (type === 'error') tg.HapticFeedback.notificationOccurred('error');
        else if (type === 'success') tg.HapticFeedback.notificationOccurred('success');
      }
    }

    // --- Simple Audio Synthesizer (No external sound files required) ---
    const audioCtx = (window.AudioContext || window.webkitAudioContext) ? new (window.AudioContext || window.webkitAudioContext)() : null;
    function playBeep(freq, type, duration) {
      if (!audioCtx) return;
      try {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function soundEat() {
      playBeep(620, 'sine', 0.12);
      setTimeout(() => playBeep(880, 'sine', 0.15), 60);
    }
    function soundGameOver() {
      playBeep(220, 'sawtooth', 0.25);
      setTimeout(() => playBeep(140, 'sawtooth', 0.35), 180);
    }
    function soundTurn() {
      playBeep(320, 'triangle', 0.04);
    }

    // --- Game Variables ---
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const GRID_SIZE = 20; // 20x20 grid
    const CELL_COUNT = 20; // 400px / 20 = 20 cells
    const CELL_SIZE = canvas.width / CELL_COUNT;

    let snake = [];
    let food = { x: 5, y: 5 };
    let direction = 'RIGHT';
    let nextDirection = 'RIGHT';
    let score = 0;
    let highScore = parseInt(localStorage.getItem('snake_high_score') || '0', 10);
    let gameInterval = null;
    let isGameOver = false;
    let isPaused = false;
    let isStarted = false;
    let foodPulse = 0;

    document.getElementById('high-score-val').textContent = highScore;

    function initGame() {
      snake = [
        { x: 8, y: 10 },
        { x: 7, y: 10 },
        { x: 6, y: 10 }
      ];
      direction = 'RIGHT';
      nextDirection = 'RIGHT';
      score = 0;
      isGameOver = false;
      isPaused = false;
      document.getElementById('score-val').textContent = score;
      spawnFood();
    }

    function spawnFood() {
      let valid = false;
      while (!valid) {
        food = {
          x: Math.floor(Math.random() * CELL_COUNT),
          y: Math.floor(Math.random() * CELL_COUNT)
        };
        valid = !snake.some(segment => segment.x === food.x && segment.y === food.y);
      }
    }

    function startGame() {
      document.getElementById('startOverlay').classList.remove('active');
      document.getElementById('gameOverOverlay').classList.remove('active');
      initGame();
      isStarted = true;
      if (gameInterval) clearInterval(gameInterval);
      gameInterval = setInterval(gameLoop, 120);
      draw();
    }

    function restartGame() {
      startGame();
    }

    function togglePause() {
      if (!isStarted || isGameOver) return;
      isPaused = !isPaused;
      document.getElementById('btn-pause').textContent = isPaused ? '▶️' : '⏸️';
    }

    function handleDirection(dir) {
      if (!isStarted || isPaused || isGameOver) return;
      // Prevent reversing
      if (dir === 'UP' && direction !== 'DOWN') nextDirection = 'UP';
      else if (dir === 'DOWN' && direction !== 'UP') nextDirection = 'DOWN';
      else if (dir === 'LEFT' && direction !== 'RIGHT') nextDirection = 'LEFT';
      else if (dir === 'RIGHT' && direction !== 'LEFT') nextDirection = 'RIGHT';

      if (nextDirection !== direction) {
        soundTurn();
      }
    }

    // --- Main Game Loop ---
    function gameLoop() {
      if (isPaused || isGameOver || !isStarted) return;

      direction = nextDirection;
      const head = { ...snake[0] };

      if (direction === 'UP') head.y -= 1;
      else if (direction === 'DOWN') head.y += 1;
      else if (direction === 'LEFT') head.x -= 1;
      else if (direction === 'RIGHT') head.x += 1;

      // Wall collision check
      if (head.x < 0 || head.x >= CELL_COUNT || head.y < 0 || head.y >= CELL_COUNT) {
        endGame();
        return;
      }

      // Self collision check
      if (snake.some(segment => segment.x === head.x && segment.y === head.y)) {
        endGame();
        return;
      }

      snake.unshift(head);

      // Check food
      if (head.x === food.x && head.y === food.y) {
        score += 10;
        document.getElementById('score-val').textContent = score;
        if (score > highScore) {
          highScore = score;
          localStorage.setItem('snake_high_score', highScore);
          document.getElementById('high-score-val').textContent = highScore;
        }
        triggerHaptic('success');
        soundEat();
        spawnFood();
      } else {
        snake.pop();
      }

      draw();
    }

    function endGame() {
      isGameOver = true;
      clearInterval(gameInterval);
      triggerHaptic('error');
      soundGameOver();
      document.getElementById('finalScoreText').textContent = `امتیاز شما: ${score}`;
      document.getElementById('gameOverOverlay').classList.add('active');
    }

    // --- Rendering / Drawing ---
    function draw() {
      foodPulse += 0.15;
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 1. Draw Grid Pattern
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
      ctx.lineWidth = 1;
      for (let i = 0; i <= CELL_COUNT; i++) {
        ctx.beginPath();
        ctx.moveTo(i * CELL_SIZE, 0);
        ctx.lineTo(i * CELL_SIZE, canvas.height);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(0, i * CELL_SIZE);
        ctx.lineTo(canvas.width, i * CELL_SIZE);
        ctx.stroke();
      }

      // 2. Draw Food (Apple with glow and leaf)
      const foodCenterX = food.x * CELL_SIZE + CELL_SIZE / 2;
      const foodCenterY = food.y * CELL_SIZE + CELL_SIZE / 2;
      const pulseRadius = (CELL_SIZE / 2.3) + Math.sin(foodPulse) * 1.5;

      // Glow effect
      const glowGrad = ctx.createRadialGradient(foodCenterX, foodCenterY, 2, foodCenterX, foodCenterY, CELL_SIZE * 0.9);
      glowGrad.addColorStop(0, 'rgba(239, 68, 68, 0.8)');
      glowGrad.addColorStop(1, 'rgba(239, 68, 68, 0)');
      ctx.fillStyle = glowGrad;
      ctx.beginPath();
      ctx.arc(foodCenterX, foodCenterY, CELL_SIZE * 0.9, 0, Math.PI * 2);
      ctx.fill();

      // Apple Body
      ctx.fillStyle = '#ef4444';
      ctx.beginPath();
      ctx.arc(foodCenterX, foodCenterY, pulseRadius, 0, Math.PI * 2);
      ctx.fill();

      // Apple Leaf
      ctx.fillStyle = '#22c55e';
      ctx.beginPath();
      ctx.ellipse(foodCenterX + 3, foodCenterY - pulseRadius + 1, 4, 2, Math.PI / 4, 0, Math.PI * 2);
      ctx.fill();

      // 3. Draw Snake
      snake.forEach((segment, index) => {
        const segX = segment.x * CELL_SIZE;
        const segY = segment.y * CELL_SIZE;
        const radius = 6;

        if (index === 0) {
          // Snake Head
          ctx.fillStyle = '#10b981';
          drawRoundedRect(ctx, segX + 1, segY + 1, CELL_SIZE - 2, CELL_SIZE - 2, 8);

          // Draw Cute Eyes
          ctx.fillStyle = '#ffffff';
          let eye1 = { x: segX + 5, y: segY + 5 };
          let eye2 = { x: segX + CELL_SIZE - 5, y: segY + 5 };

          if (direction === 'DOWN') {
            eye1 = { x: segX + 5, y: segY + CELL_SIZE - 5 };
            eye2 = { x: segX + CELL_SIZE - 5, y: segY + CELL_SIZE - 5 };
          } else if (direction === 'LEFT') {
            eye1 = { x: segX + 5, y: segY + 5 };
            eye2 = { x: segX + 5, y: segY + CELL_SIZE - 5 };
          } else if (direction === 'RIGHT') {
            eye1 = { x: segX + CELL_SIZE - 5, y: segY + 5 };
            eye2 = { x: segX + CELL_SIZE - 5, y: segY + CELL_SIZE - 5 };
          }

          ctx.beginPath();
          ctx.arc(eye1.x, eye1.y, 3, 0, Math.PI * 2);
          ctx.arc(eye2.x, eye2.y, 3, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = '#0f172a';
          ctx.beginPath();
          ctx.arc(eye1.x, eye1.y, 1.5, 0, Math.PI * 2);
          ctx.arc(eye2.x, eye2.y, 1.5, 0, Math.PI * 2);
          ctx.fill();

        } else {
          // Snake Body (Gradient fading to tail)
          const ratio = 1 - (index / snake.length) * 0.45;
          ctx.fillStyle = `rgb(${Math.floor(16 * ratio)}, ${Math.floor(185 * ratio)}, ${Math.floor(129 * ratio)})`;
          drawRoundedRect(ctx, segX + 2, segY + 2, CELL_SIZE - 4, CELL_SIZE - 4, radius);
        }
      });
    }

    function drawRoundedRect(ctx, x, y, width, height, radius) {
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.lineTo(x + width - radius, y);
      ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
      ctx.lineTo(x + width, y + height - radius);
      ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
      ctx.lineTo(x + radius, y + height);
      ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
      ctx.lineTo(x, y + radius);
      ctx.quadraticCurveTo(x, y, x + radius, y);
      ctx.closePath();
      ctx.fill();
    }

    // --- Keyboard Event Listeners ---
    window.addEventListener('keydown', (e) => {
      switch (e.key) {
        case 'ArrowUp':
        case 'w':
        case 'W':
          handleDirection('UP');
          e.preventDefault();
          break;
        case 'ArrowDown':
        case 's':
        case 'S':
          handleDirection('DOWN');
          e.preventDefault();
          break;
        case 'ArrowLeft':
        case 'a':
        case 'A':
          handleDirection('LEFT');
          e.preventDefault();
          break;
        case 'ArrowRight':
        case 'd':
        case 'D':
          handleDirection('RIGHT');
          e.preventDefault();
          break;
        case ' ':
          togglePause();
          e.preventDefault();
          break;
      }
    });

    // --- Touch Swipe Detection ---
    let touchStartX = 0;
    let touchStartY = 0;
    canvas.addEventListener('touchstart', (e) => {
      const touch = e.touches[0];
      touchStartX = touch.clientX;
      touchStartY = touch.clientY;
    }, { passive: true });

    canvas.addEventListener('touchend', (e) => {
      const touch = e.changedTouches[0];
      const diffX = touch.clientX - touchStartX;
      const diffY = touch.clientY - touchStartY;
      const minDistance = 25;

      if (Math.abs(diffX) > Math.abs(diffY)) {
        if (Math.abs(diffX) > minDistance) {
          handleDirection(diffX > 0 ? 'RIGHT' : 'LEFT');
        }
      } else {
        if (Math.abs(diffY) > minDistance) {
          handleDirection(diffY > 0 ? 'DOWN' : 'UP');
        }
      }
    }, { passive: true });

    // Initial render
    initGame();
    draw();
  </script>
</body>
</html>
